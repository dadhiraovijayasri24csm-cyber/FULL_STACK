<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stranger Things Event Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(to bottom,#000,#1a0000,#000);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:450px;
    background:rgba(20,20,20,0.95);
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 20px red;
    border:2px solid crimson;
}

h1{
    text-align:center;
    color:#ff3333;
    text-shadow:0 0 10px red;
    margin-bottom:5px;
}

p{
    text-align:center;
    color:#ddd;
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:6px;
    background:#2d2d2d;
    color:white;
    font-size:15px;
}

input:focus,
select:focus{
    outline:none;
    box-shadow:0 0 10px red;
}

button{
    width:48%;
    padding:12px;
    border:none;
    border-radius:6px;
    margin-top:15px;
    cursor:pointer;
    font-size:15px;
}

.register{
    background:crimson;
    color:white;
}

.register:hover{
    background:red;
}

.reset{
    background:#444;
    color:white;
}

.reset:hover{
    background:#666;
}

#result{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#111;
    border:1px solid red;
    animation:fade 0.5s;
}

@keyframes fade{
from{opacity:0;transform:scale(0.9);}
to{opacity:1;transform:scale(1);}
}

.success{
    color:#00ff99;
    font-size:20px;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h1>STRANGER THINGS</h1>
<p>Upside Down Event Registration</p>

<input type="text" id="name" placeholder="Your Name">

<input type="email" id="email" placeholder="Email">

<select id="house">
<option value="">Choose Your Team</option>
<option>Hawkins Heroes</option>
<option>Hellfire Club</option>
<option>Scoops Troop</option>
<option>Upside Down Explorers</option>
</select>

<select id="event">
<option value="">Choose Event</option>
<option>Escape the Upside Down</option>
<option>Demogorgon Hunt</option>
<option>80's Costume Contest</option>
<option>Trivia Challenge</option>
</select>

<div style="display:flex;justify-content:space-between;">
<button class="register" onclick="register()">Register</button>
<button class="reset" onclick="resetForm()">Reset</button>
</div>

<div id="result"></div>

</div>

<script>

function register(){

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let team=document.getElementById("house").value;
let event=document.getElementById("event").value;

if(name=="" || email=="" || team=="" || event==""){
    alert("Please fill all fields.");
    return;
}

let id="ST-"+Math.floor(1000+Math.random()*9000);

let now=new Date();

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=
"<h2 class='success'>🎉 Registration Successful!</h2><br>"+
"<b>Registration ID:</b> "+id+"<br><br>"+
"<b>Name:</b> "+name+"<br>"+
"<b>Email:</b> "+email+"<br>"+
"<b>Team:</b> "+team+"<br>"+
"<b>Event:</b> "+event+"<br>"+
"<b>Date:</b> "+now.toLocaleString()+"<br><br>"+
"<span style='color:#ff5555;'>Welcome, "+name+
"! The gate to the <b>Upside Down</b> awaits you...</span>";

}

function resetForm(){

document.getElementById("name").value="";
document.getElementById("email").value="";
document.getElementById("house").selectedIndex=0;
document.getElementById("event").selectedIndex=0;
document.getElementById("result").style.display="none";

}

</script>

</body>
</html>
